# AppVault build pipeline; extracts the uploaded source archive before compiling.
name: build release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'AppVault-source.zip'
      - '.github/workflows/build-release-apk.yml'
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-build:
    name: Extract source, test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Android project into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -s AppVault-source.zip
          mkdir -p "$RUNNER_TEMP/appvault-archive"
          unzip -q AppVault-source.zip -d "$RUNNER_TEMP/appvault-archive"
          test -f "$RUNNER_TEMP/appvault-archive/AppVault/app/build.gradle.kts"
          cp -an "$RUNNER_TEMP/appvault-archive/AppVault/." .
          # Keep the bootstrap workflow in the repository; do not overwrite it with
          # the older workflow bundled inside the source archive.
          git checkout -- .github/workflows/build-release-apk.yml
          test -f app/src/main/AndroidManifest.xml
          test -f .github/workflows/build-release-apk.yml

      - name: Commit extracted project files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract AppVault Android project from source archive"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Project files are already extracted."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=1 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run tests and build APKs
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AppVault-APKs
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
